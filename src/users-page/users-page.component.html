<div class="users-page">
  <h2 class="users-title">Список Пользователей</h2>
  <app-user-create (createUser)="onCreateUser($event)"></app-user-create>
  <app-users-filter (searchChange)="onSearchChange($event)"></app-users-filter>
  @if (filteredUsers$ | async; as users) {
    <div class="users-grid">
      @for (user of users; track user.id) {
        <app-user-card [user]="user" (deleteUser)="onDeleteUser($event)"></app-user-card>
      } @empty {
        <div class="users-empty">Нет пользователей для отображения</div>
      }
    </div>
  }
</div>
